name: Build & Release Hi3Helper.Sophon Tools

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v5.6.0)'
        required: true
      release_name:
        description: 'Release title'
        default: 'Hi3Helper.Sophon Tools'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore projects
        run: |
          dotnet restore Hi3Helper.Sophon.csproj
          dotnet restore Hi3Helper.Sophon.Universal.csproj
          dotnet restore Test/SophonManifestInfo2Json/SophonManifestInfo2Json.csproj

      - name: Publish outputs
        run: |
          dotnet publish Test/SophonManifestInfo2Json/SophonManifestInfo2Json.csproj -c Release -f net9.0 -o artifacts/SophonManifestInfo2Json
          dotnet publish Hi3Helper.Sophon.csproj -c Release -f net9.0 -o artifacts/SophonLib/net9.0
          dotnet publish Hi3Helper.Sophon.Universal.csproj -c Release -f net9.0 -o artifacts/SophonUniversal/net9.0

      - name: Package artifacts
        run: zip -r Hi3HelperTools.zip artifacts

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" Hi3HelperTools.zip \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.release_name }} ${{ inputs.release_tag }}" \
            --notes "Automated build of Hi3Helper.Sophon tools." \
            --target "${{ github.sha }}" || \
          gh release upload "${{ inputs.release_tag }}" Hi3HelperTools.zip \
            --repo "${{ github.repository }}" --clobber
