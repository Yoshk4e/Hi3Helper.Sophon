name: Build & Release Hi3Helper.Sophon

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v5.6.0)'
        required: true
      release_name:
        description: 'Release title'
        default: 'Hi3Helper.Sophon Tools'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      # Restore everything via the Test solution (covers all test projects) and the two library projects
      - name: Restore all projects
        run: |
          dotnet restore Test/Hi3Helper.Sophon.Test.sln
          dotnet restore Hi3Helper.Sophon.csproj
          dotnet restore Hi3Helper.Sophon.Universal.csproj

      # Publish each Test project by path
      - name: Publish Test tools (native EXEs)
        run: |
          mkdir -p artifacts/Test/SophonDownload
          dotnet publish Test/SophonDownload/SophonDownload.csproj \
            -c Release -f net9.0 -r win-x64 --self-contained false \
            -o artifacts/Test/SophonDownload

          mkdir -p artifacts/Test/SophonManifestInfo2Json
          dotnet publish Test/SophonManifestInfo2Json/SophonManifestInfo2Json.csproj \
            -c Release -f net9.0 -r win-x64 --self-contained false \
            -o artifacts/Test/SophonManifestInfo2Json

          mkdir -p artifacts/Test/SophonUpdatePreload
          dotnet publish Test/SophonUpdatePreload/SophonUpdatePreload.csproj \
            -c Release -f net9.0 -r win-x64 --self-contained false \
            -o artifacts/Test/SophonUpdatePreload

      # Publish libraries
      - name: Publish Libraries (DLLs)
        run: |
          mkdir -p artifacts/Libraries/SophonLib
          dotnet publish Hi3Helper.Sophon.csproj \
            -c Release -f net9.0 \
            -o artifacts/Libraries/SophonLib

          mkdir -p artifacts/Libraries/SophonUniversal
          dotnet publish Hi3Helper.Sophon.Universal.csproj \
            -c Release -f net9.0 \
            -o artifacts/Libraries/SophonUniversal

      # Package everything
      - name: Zip artifacts
        run: |
          zip -r Hi3HelperTools.zip artifacts

      # Create or update GitHub Release via gh
      - name: Create / Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" Hi3HelperTools.zip \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.release_name }} ${{ inputs.release_tag }}" \
            --notes "Automated build of Hi3Helper.Sophon tools" \
            --target "${{ github.sha }}" || \
          gh release upload "${{ inputs.release_tag }}" Hi3HelperTools.zip \
            --repo "${{ github.repository }}" --clobber
