name: Build & Release Hi3Helper Tools

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v5.6.0)'
        required: true
      release_name:
        description: 'Release title'
        default: 'Hi3Helper Tools'
      manifest_url:
        description: '(Optional) manifest URL to decode after build'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore projects
        run: |
          dotnet restore Hi3Helper.Sophon.Universal.csproj
          dotnet restore Hi3Helper.Sophon.csproj
          dotnet restore Test/SophonManifestInfo2Json/SophonManifestInfo2Json.csproj
          dotnet restore Test/SophonManifestInspector/SophonManifestInspector.csproj
          dotnet restore Test/SophonPatchDiffReader/SophonPatchDiffReader.csproj

      - name: Build and publish all tools
        run: |
          dotnet publish Test/SophonManifestInfo2Json/SophonManifestInfo2Json.csproj \
            -c Release -o artifacts/SophonManifestInfo2Json
          dotnet publish Test/SophonManifestInspector/SophonManifestInspector.csproj \
            -c Release -o artifacts/SophonManifestInspector
          dotnet publish Test/SophonPatchDiffReader/SophonPatchDiffReader.csproj \
            -c Release -o artifacts/SophonPatchDiffReader
          dotnet publish Hi3Helper.Sophon/Hi3Helper.Sophon.csproj \
            -c Release -o artifacts/SophonLib
          dotnet publish Hi3Helper.Sophon.Universal.csproj \
            -c Release -o artifacts/SophonUniversal

      - name: Zip all artifacts
        run: |
          zip -r Hi3HelperTools.zip artifacts

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token

      - name: Create or Update Release
        run: |
          gh release create "${{ inputs.release_tag }}" Hi3HelperTools.zip \
            --title "${{ inputs.release_name }} ${{ inputs.release_tag }}" \
            --notes "Automated build of Hi3Helper tools." \
            --target "${{ github.sha }}" || \
          gh release upload "${{ inputs.release_tag }}" Hi3HelperTools.zip --clobber
